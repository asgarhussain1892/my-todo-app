<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <form id="add-form">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="500" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <ul id="task-list"></ul>
    <p id="empty" hidden>Start adding your tasks</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
